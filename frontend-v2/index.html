<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <title>NDX Invest · 三页统一原型</title>  
  






<style>
    :root { --nav-index: 0; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5f7f8;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      font-family:
        -apple-system, BlinkMacSystemFont,
        "SF Pro Display", "SF Pro Text",
        "PingFang SC", "Microsoft YaHei",
        "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      position: relative;
      width: min(100%, 430px);
      height: 100vh;
      overflow: hidden;
      background: #f5f7f8;
      isolation: isolate;
    }

    .page-frame {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f5f7f8;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(0);
    }

    .page-frame.is-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .page-frame.is-transitioning {
      visibility: visible;
      pointer-events: none;
      will-change: opacity, transform;
    }

    .global-nav {
      position: absolute;
      z-index: 40;
      left: 50%;
      bottom: calc(7px + env(safe-area-inset-bottom,0px));
      transform: translateX(-50%);
      width: min(calc(100% - 22px),408px);
      height: 58px;
      padding: 6px 10px;
      display: grid;
      grid-template-columns: repeat(3,1fr);
      border-radius: 999px;
      background: rgba(255,255,255,.95);
      border: 1px solid rgba(224,227,231,.94);
      box-shadow: 0 10px 30px rgba(28,31,36,.09);
      /* The nearly opaque bar needs no expensive full-width blur on Android. */
      transition:
        opacity 190ms ease,
        transform 220ms cubic-bezier(.2,.8,.2,1);
      will-change: opacity, transform;
    }

    .global-nav.is-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(12px);
    }

    .global-nav-indicator {
      position: absolute;
      z-index: 0;
      left: 10px;
      top: 6px;
      bottom: 6px;
      width: calc((100% - 20px) / 3);
      border-radius: 999px;
      background: #e7f2ec;
      transform: translateX(calc(var(--nav-index) * 100%));
      transition: transform 240ms cubic-bezier(.2,.8,.2,1);
      will-change: transform;
      pointer-events: none;
    }

    .global-nav-item {
      position: relative;
      z-index: 1;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #969ca6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      transition:
        color 180ms ease,
        transform 180ms cubic-bezier(.2,.8,.2,1);
      -webkit-tap-highlight-color: transparent;
    }

    .global-nav-item.is-active { color: #2a8b67; }
    .global-nav-item.is-pressing { transform: scale(1.04); }

    .global-nav-icon {
      width: 38px;
      height: 25px;
      display: grid;
      place-items: center;
    }

    .global-nav-item svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    .global-nav-label {
      font-size: 10px;
      line-height: 1;
      font-weight: 600;
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      .global-nav,
      .global-nav-indicator,
      .global-nav-item {
        transition: none !important;
      }
    }

    @media (min-width: 431px) {
      body { padding: 22px 0; }

      .app-shell {
        height: calc(100vh - 44px);
        border-radius: 28px;
        box-shadow: 0 24px 70px rgba(18,21,26,.12);
      }
    }
  

  .records-page {
    position: absolute;
    z-index: 70;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #f5f6f8;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateX(18px);
    transition:
      opacity 220ms cubic-bezier(.2,.8,.2,1),
      transform 240ms cubic-bezier(.2,.8,.2,1),
      visibility 0s linear 240ms;
  }

  .records-page.is-open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateX(0);
    transition:
      opacity 220ms cubic-bezier(.2,.8,.2,1),
      transform 240ms cubic-bezier(.2,.8,.2,1),
      visibility 0s linear 0s;
  }

  @media (prefers-reduced-motion: reduce) {
    .records-page { transition: none !important; }
  }


  .buy-page {
    position: absolute;
    z-index: 80;
    inset: 0;
    background:
      radial-gradient(circle at 80% 4%, rgba(98,191,160,.05), transparent 24%),

    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateX(18px);

      opacity 220ms cubic-bezier(.2,.8,.2,1),
      transform 240ms cubic-bezier(.2,.8,.2,1),
      visibility 0s linear 240ms;
    overflow: hidden;
  }

  .buy-page.is-open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateX(0);
    transition:
      opacity 220ms cubic-bezier(.2,.8,.2,1),
      transform 240ms cubic-bezier(.2,.8,.2,1),
      visibility 0s linear 0s;

  .buy-page-shell {
    position: relative;
    height: 100%;

    flex-direction: column;

  .buy-card {
    width: 100%;
    background: #fff;
    border: 1px solid rgba(229,232,236,.9);
    border-radius: 22px;

  .fund-select-card {
    appearance: none;
    position: relative;
    min-height: 76px;
    padding: 0 18px;
    display: grid;
    grid-template-columns: minmax(0,1fr) 20px;
    gap: 10px;
    align-items: center;
    overflow: visible;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .fund-select-card:active {
    transform: scale(.995);
  }

  .fund-select-card .fund-select-copy,
  .fund-select-card .fund-chevron {
    transition:
      opacity 220ms ease,
      transform 300ms cubic-bezier(.2,.8,.2,1);
  }

  .fund-select-card.is-picker-source {
    pointer-events: none;
  }

  .fund-select-card.is-picker-source .fund-select-copy,
  .fund-select-card.is-picker-source .fund-chevron {
    opacity: 0;
    transform: translateY(2px);
  }

  .fund-select-card.is-picker-hidden {
    opacity: 0;
  }


  .fund-select-copy {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .fund-select-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .holding-dot {
    width: 8px;
    height: 8px;
    flex: 0 0 auto;
    border-radius: 999px;
    background: #2fa36b;
    box-shadow: 0 0 0 4px rgba(47,163,107,.12);
  }

  .fund-select-name {
    min-width: 0;
    font-size: 15px;
    line-height: 1.22;
    font-weight: 600;
    color: #2c4550;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .fund-select-meta {
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 400;

  }


  .fund-chevron {
    display: grid;
    place-items: center;
    color: #b8c1c9;
  }

  .fund-chevron svg {
    width: 16px;
    height: 16px;
  }

  .buy-mode-wrap {
    padding: 5px;
  }

  .buy-mode {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 44px;
    border-radius: 15px;
    background: #f0f2f3;
    overflow: hidden;
  }

  .buy-mode-indicator {
    position: absolute;
    z-index: 0;
    top: 4px;
    left: 4px;
    width: calc((100% - 8px) / 2);
    height: calc(100% - 8px);
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 2px 8px rgba(28,31,36,.06);
    transform: translateX(0);
    transition: transform 220ms cubic-bezier(.2,.8,.2,1);
  }

  .buy-mode.is-recurring .buy-mode-indicator {
    transform: translateX(100%);
  }

  .buy-mode-button {
    position: relative;
    z-index: 1;
    border: 0;
    background: transparent;
    color: #8c9aa3;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .buy-mode-button.active {
    color: #3f5550;
  }

  .recurring-panel-inner {

window.V2DateTime = (value,dateOnly=false) => {
 const text=String(value??'--').trim()||'--';
 if(!/^\d{4}-\d{2}-\d{2}T/.test(text))return dateOnly?text.slice(0,10):text;
 if(!/(?:Z|[+-]\d{2}:?\d{2})$/.test(text))return '--';
 const date=new Date(text);if(!Number.isFinite(date.getTime()))return '--';
 const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(date);
 const get=type=>parts.find(part=>part.type===type).value;
 const day=get('year')+'-'+get('month')+'-'+get('day');
 return dateOnly?day:day+' '+get('hour')+':'+get('minute')+':'+get('second');
};
window.V2Display = value => {
  const text = String(value ?? '--').trim();
  const m = text.match(/^([+-]?)([¥￥]?)(\d[\d,]*)(?:\.(\d+))?(\s*(?:%|万元|元|份|万))?$/);
  if (!m) return text;
  const fraction = m[4] || '';
  let cents = BigInt(m[3].replace(/,/g,'')) * 100n + BigInt((fraction+'00').slice(0,2));
  if ((fraction[2] || '0') >= '5') cents += 1n;
  let whole = (cents / 100n).toString();
  if(m[3].includes(',')) whole = whole.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return m[1]+m[2]+whole+'.'+(cents%100n).toString().padStart(2,'0')+(m[5]||'');
};

// Presentation geometry: equal strategy intervals with continuous interpolation.
function v2DrawdownMarkerPercent(current,tiers) {
  const magnitude=Math.max(0,Number(current)||0);
  const thresholds=tiers.map(t=>Number(t.drawdownThreshold)).filter(t=>Number.isFinite(t)&&t>0);
  if(!thresholds.length)return 0;
  let previous=0;
  for(let index=0;index<thresholds.length;index++){
    const threshold=thresholds[index];
    if(magnitude<=threshold)return (index+(magnitude-previous)/(threshold-previous))/thresholds.length*100;
    previous=threshold;
  }

ansform-origin: left center;\n  transition: transform 500ms cubic-bezier(.22,.61,.36,1);\n}\n.drawdown-ticks { position: absolute; inset: 0; pointer-events: none; }\n.drawdown-tick {\n  position: absolute; left: var(--node-position); top: 10px; width: 1px; height: 4px;\n  background: var(--dd-tick); transition: background-color 200ms ease;\n}\n.drawdown-tick.is-reached { background: var(--dd-passed); }\n.static-drawdown #drawdownMarker {\n  inset: 50% auto auto 0; width: 100%; height: 0; pointer-events: none;\n  transform: translateX(var(--marker-position,0%));\n  transition: transform 500ms cubic-bezier(.22,.61,.36,1), opacity 200ms ease;\n}\n.static-drawdown #drawdownMarker .static-marker-dot {\n  left: 0; top: 0; width: 10px; height: 10px; background: var(--dd-progress);\n  border: 2px solid var(--surface); box-shadow: none;\n}\n.static-drawdown #currentStageName { color: var(--dd-label-passed); }\n.static-drawdown #drawdownRangeLabels { display: block; position: relative; margin: 12px 22px 0; min-height: 14px; }\n.static-drawdown #drawdownRangeLabels > span {\n  position: absolute; left: var(--node-position); top: var(--label-top,0px);\n  width: max-content; padding: 0; white-space: nowrap; overflow: visible;\n  transform: translateX(-50%); color: var(--dd-label); font-variant-numeric: tabular-nums;\n  transition: color 200ms ease;\n}\n.static-drawdown #drawdownRangeLabels > span.is-reached { color: var(--dd-label-passed); }\n.refresh { position: relative; }\n.refresh-arrow, .refresh-check {\n  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;\n  transition: opacity 500ms ease, transform 600ms cubic-bezier(.2,.85,.3,1.18);\n}\n.refresh-arrow { opacity: 1; transform: scale(1); }\n.refresh-check { opacity: 0; transform: scale(.45); }\n.refresh[data-refresh-phase=\"loading\"] .refresh-arrow svg { animation: home-refresh-spin 800ms linear infinite; }\n.refresh[data-refresh-phase=\"success\"] .refresh-arrow { opacity: 0; transform: scale(.45); }\n.refresh[data-refresh-phase=\"success\"] .refresh-check { opacity: 1; transform: scale(1); }\n@keyframes home-refresh-spin { to { transform: rotate(360deg); } }\n@media (prefers-reduced-motion: reduce) {\n  .drawdown-fill, .static-drawdown #drawdownMarker, .refresh-arrow, .refresh-check { transition: none; }\n  .refresh[data-refresh-phase=\"loading\"] .refresh-arrow svg { animation: none; }\n}\n</style><style id=\"v2-acceptance-market-tones\">\nhtml .hero-change-number.negative,html .hero-change-percent.negative,html .fx-change.negative{color:var(--loss,var(--red))}\nhtml .hero-change-number.neutral,html .hero-change-percent.neutral,html .fx-change.neutral{color:var(--text-2)}\n</style></head>\n\n<body>\n  <main class=\"app\">\n    <div class=\"safe-top\"></div>\n\n    <header class=\"topbar home-brandbar\">\n      <div class=\"brand-wrap brand-reference\">\n        <div class=\"brand-line\">\n          <span class=\"brand-ndx\">NDX</span>\n          <span class=\"brand-invest\">Invest</span>\n        </div>\n        <div class=\"brand-subtitle\">专注长期 · 让投资更简单</div>\n      </div>\n\n      <span aria-hidden=\"true\" style=\"width:44px;height:44px;flex-shrink:0\"></span>\n    </header>\n\n    <section class=\"content\">\n\n      <section class=\"hero hero-reference\">\n        <div class=\"hero-reference-grid\">\n          <div class=\"hero-reference-left\">\n            <div class=\"index-heading\">NASDAQ-100 / NDX</div>\n            <div class=\"index-value\">25,612.84</div>\n            <div class=\"hero-change-row\">\n              <span class=\"hero-change-number\">+213.47</span>\n              <span class=\"hero-change-percent\">+0.84%</span>\n            </div>\n          </div>\n\n          <div class=\"hero-right\">\n            <div class=\"market-status\">\n              <span class=\"status-dot\"></span>\n              <span>交易中</span>\n            </div>\n            <div class=\"hero-updated\" id=\"updatedText\">更新于 2026/09/21 15:42</div>\n          </div>\n        </div>\n      </section>\n\n      <section class=\"section compact-section\">\n        <section class=\"card drawdown-card static-drawdown\">\n          <div class=\"drawdown-head\">\n            <div>\n              <div class=\"small-label\">当前回撤</div>\n              <div class=\"drawdown-value\">-13.6%</div>\n            </div>\n\n            <div class=\"plan-inline\">\n              <div class=\"plan-inline-label\">计划投入</div>\n              <div class=\"plan-inline-value\">¥1,000</div>\n            </div>\n          </div>\n\n          <div class=\"current-stage-hint\">当前档位 <strong id=\"currentStageName\">第一档</strong></div>\n\n          <div class=\"static-dd-track\" id=\"drawdownTrack\" role=\"img\" aria-label=\"当前回撤\">\n            <div class=\"drawdown-base\"></div>\n            <div class=\"drawdown-fill\" id=\"drawdownFill\"></div>\n            <div class=\"drawdown-ticks\" id=\"drawdownTicks\" aria-hidden=\"true\"></div>\n            <div class=\"static-dd-marker\" id=\"drawdownMarker\" aria-hidden=\"true\"><div class=\"static-marker-dot\"></div></div>\n          </div>\n          <div class=\"static-range-labels\" id=\"drawdownRangeLabels\" aria-hidden=\"true\"></div>\n        </section>\n      </section>\n\n      <section class=\"section compact-section\">\n        <section class=\"card longterm-card compact-longterm\">\n          <div class=\"card-meta-row\">\n            <div class=\"small-label\">长期表现</div>\n          </div>\n          <div class=\"period-tabs sliding-tabs\" id=\"periodTabs\">\n            <div class=\"period-slider\" id=\"periodSlider\"></div>\n            <button class=\"period-tab\" data-index=\"0\" data-period=\"1Y\">1Y</button>\n            <button class=\"period-tab\" data-index=\"1\" data-period=\"3Y\">3Y</button>\n            <button class=\"period-tab active\" data-index=\"2\" data-period=\"5Y\">5Y</button>\n            <button class=\"period-tab\" data-index=\"3\" data-period=\"10Y\">10Y</butto               <div class=\"metric-value positive\">+92.4%</div>\n                </div>\n                <div class=\"longterm-cell\">\n                  <div class=\"metric-label\">CAGR（年化收益率）</div>\n                  <div class=\"metric-value positive\">+14.0%</div>\n                </div>\n                <div class=\"longterm-cell\">\n                  <div class=\"metric-label\">最大回撤</div>\n                  <div class=\"metric-value negative\">-35.6%</div>\n                </div>\n                <div class=\"longterm-cell\">\n                  <div class=\"metric-label\">年化波动率</div>\n                  <div class=\"metric-value\">23.1%</div>\n                </div>\n              </div>\n\n              <div class=\"metrics-page\">\n                <div class=\"longterm-cell\">\n                  <div class=\"metric-label\">累计收益</div>\n                  <div class=\"metric-value positive\">+311.7%</div>\n                </div>\n                <div class=\"longterm-cell\">\n                  <div class=\"metric-label\">CAGR（年化收益率）</div>\n                  <div class=\"metric-value positive\">+15.2%</div>\n                </div>\n                <div class=\"longterm-cell\">\n                  <div class=\"metric-label\">最大回撤</div>\n                  <div class=\"metric-value negative\">-35.6%</div>\n                </div>\n                <div class=\"longterm-cell\">\n                  <div class=\"metric-label\">年化波动率</div>\n                  <div class=\"metric-value\">22.8%</div>\n                </div>\n              </div>\n            </div>\n          </div>\n        </section>\n      </section>\n\n      <section class=\"section compact-section\">\n        <section class=\"card fx-card fx-card-compact\">\n          <div class=\"fx-card-label\">汇率</div>\n          <div class=\"fx-content-row\">\n          <div class=\"fx-left\">\n            <div class=\"fx-name\">USD/CNY</div>\n            <div class=\"fx-note\">美元 / 人民币</div>\n          </div>\n\n          <div class=\"fx-right\">\n            <div class=\"fx-value\">7.1234</div>\n            <div class=\"fx-change\">+0.18%</div>\n          </div>\n          </div>\n        </section>\n      </section>\n\n    </section>\n\n    <nav class=\"nav\">\n      <button class=\"nav-item active\" data-page=\"NDX100\">\n        <span class=\"nav-icon-wrap\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\n            <path d=\"M4 18V10M10 18V6M16 18V13M22 18V3\"\n                  stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\n          </svg>\n        </span>\n        <span class=\"nav-label\">NDX100</span>\n      </button>\n\n      <button class=\"nav-item\" data-page=\"持仓\">\n        <span class=\"nav-icon-wrap\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\n            <path d=\"M4 7.5C4 6.67 4.67 6 5.5 6H18.5C19.33 6 20 6.67 20 7.5V17.5C20 18.33 19.33 19 18.5 19H5.5C4.67 19 4 18.33 4 17.5V7.5Z\"\n                  stroke=\"currentColor\" stroke-width=\"1.7\"/>\n            <path d=\"M7 6V4.8C7 4.36 7.36 4 7.8 4H16.2C16.64 4 17 4.36 17 4.8V6\"\n                  stroke=\"currentColor\" stroke-width=\"1.7\"/>\n            <path d=\"M4 11H20\"\n                  stroke=\"currentColor\" stroke-width=\"1.7\"/>\n          </svg>\n        </span>\n        <span class=\"nav-label\">持仓</span>\n      </button>\n\n      <button class=\"nav-item\" data-page=\"我的\">\n        <span class=\"nav-icon-wrap\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\n            <circle cx=\"12\" cy=\"8\" r=\"3.2\" stroke=\"currentColor\" stroke-width=\"1.7\"/>\n            <path d=\"M5.5 19C6.1 15.9 8.4 14.2 12 14.2C15.6 14.2 17.9 15.9 18.5 19\"\n                  stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"/>\n          </svg>\n        </span>\n        <span class=\"nav-label\">我的</span>\n      </button>\n    </nav>\n\n    <button id=\"refreshButton\" class=\"refresh v2-bottom-refresh\" aria-label=\"下拉或点击刷新数据\" data-refresh-phase=\"idle\"></button>\n    <div class=\"toast\" id=\"toast\">原型页面：稍后接入</div>\n  </main>\n\n    \n\n\n\n<script>(() => {\n  const text = (selector, value) => { const node = document.querySelector(selector); if (node) node.textContent = value; };\n  const periodTabs = [...document.querySelectorAll('.period-tab')];\n  const periodSlider = document.getElementById('periodSlider');\n  const metricsPages = document.getElementById('metricsPages');\n  function setPerformancePage(index, animate = true) {\n        periodTabs.forEach((tab, i) => {\n          tab.classList.toggle(\"active\", i === index);\n        });\n\n        if (!periodSlider || !metricsPages) return;\n\n        if (!animate) {\n          periodSlider.style.transition = \"none\";\n          metricsPages.style.transition = \"none\";\n        }\n\n        periodSlider.style.transform = `translateX(${index * 100}%)`;\n        metricsPages.style.transform = `translateX(-${index * 25}%)`;\n\n        if (!animate) {\n          requestAnimationFrame(() => {\n            requestAnimationFrame(() => {\n              periodSlider.style.transition = \"\";\n              metricsPages.style.transition = \"\";\n            });\n          });\n        }\n      }\n\n  periodTabs.forEach((tab, index) => tab.addEventListener('click', () => setPerformancePage(index)));\n  setPerformancePage(2, false);\n  function setTone(node,value) {\n    if (!node) return;\n    node.classList.remove('positive','negative','neutral');\n    const display=String(value).trim();node.classList.add(display.startsWith('-') ? 'negative' : display.startsWith('+') ? 'positive' : 'neutral');\n  }\n  const tierName = index => '第' + (['一','二','三','四','五','六','七','八'][index] || String(index+1)) + '档';\n  const refreshButton = document.getElementById('refreshButton');\n  const refreshControl = parent.V2BottomRefresh.mount(refreshButton, {\n    scrollRoot: document.querySelector('.content'),\n    canStart: () => window.frameElement.classList.contains('is-active')\n  });\n  const updateRefresh = (loading, succeeded = false, error = \"\") => refreshControl.update(loading, succeeded, error);\n  window.V2HomeRefresh = Object.freeze({update:updateRefresh});\n  let tickKey = '', labelFrame = 0;\n  const track = document.getElementById('drawdownTrack');\n  const labels = document.getElementById('drawdownRangeLabels');\n  const ticks = document.getElementById('drawdownTicks');\n  function arrangeLabels() {\n    cancelAnimationFrame(labelFrame);\n    labelFrame = requestAnimationFrame(() => {\n      const lanes = [], origin = labels.getBoundingClientRect().left;\n      for (const label of labels.children) {\n        const box = label.getBoundingClientRect();\n        const left = box.left - origin, right = box.right - origin;\n        let lane = lanes.findIndex(end => end + 5 <= left);\n        if (lane < 0) lane = lanes.length;\n        lanes[lane] = right;\n        label.style.setProperty('--label-top', `${lane * 15}px`);\n      }\n      labels.style.height = `${Math.max(1, lanes.length) * 15}px`;\n    });\n  }\n  new ResizeObserver(arrangeLabels).observe(track);\n  function render(state) {\n    const m = state.nd100;\n    const tiers = state.nd100Strategy.tiers;\n    const raw = m.drawdownRate;\n    const known = raw === undefined ? /^[+-]?\\d+(?:\\.\\d+)?%$/.test(String(m.drawdownText)) : raw !== null && Number.isFinite(Number(raw));\n    const magnitude = known ? Math.max(0, -(raw === undefined ? parseFloat(m.drawdownText) : Number(raw) * 100)) : 0;\n    const maximum = Math.max(...tiers.map(t => Number(t.drawdownThreshold)));\n    const percent = parent.v2DrawdownMarkerPercent(magnitude, tiers);\n    let active = -1;\n    tiers.forEach((t, i) => { if (known && magnitude >= Number(t.drawdownThreshold)) active = i; });\n    const marketStatus = String(m.marketStatus).split(/\\s*[·—-]\\s*/).find(s => !/腾讯|新浪|Nasdaq|东方财富|缓存|Mock/.test(s)) || '--';\n    const updated = String(m.updatedText).replace(/^行情\\s*/, '').replace(/\\s*·\\s*(?:更新中|缓存)/g, '').replace(/^正在更新$/, '--');\n    [['.index-value',m.indexText],['.hero-change-number',m.changeText],['.hero-change-percent',m.changePercentText],['.market-status span:last-child',marketStatus],['#updatedText',updated],['.fx-value',m.fxText],['.fx-change',m.fxChangeText],['.drawdown-value',m.drawdownText],['#currentStageName',known ? active < 0 ? '观察' : tierName(active) : '--'],['.plan-inline-label',m.planLabel],['.plan-inline-value',m.planText]].forEach(([s,v]) => text(s,v));\n    setTone(document.querySelector('.hero-change-number'),m.changeText);\n    setTone(document.querySelector('.hero-change-percent'),m.changePercentText);\n    setTone(document.querySelector('.fx-change'),m.fxChangeText);\n    const key = JSON.stringify(tiers.map(t => t.drawdownThreshold));\n    if (key !== tickKey) {\n      tickKey = key; labels.replaceChildren(); ticks.replaceChildren();\n      for (const [index, threshold] of [0, ...tiers.map(t => Number(t.drawdownThreshold))].entries()) {\n        const position = tiers.length > 0 ? index / tiers.length * 100 : 0;\n        const label = document.createElement('span'), tick = document.createElement('span');\n        label.textContent = threshold === 0 ? '0%' : `-${threshold}%`;\n        tick.className = 'drawdown-tick';\n        for (const node of [label,tick]) {\n          node.dataset.threshold = String(threshold);\n          node.style.setProperty('--node-position', `${position}%`);\n        }\n        labels.append(label); ticks.append(tick);\n      }\n      arrangeLabels();\n    }\n    for (const node of [...ticks.children, ...labels.children]) node.classList.toggle('is-reached',known && magnitude >= Number(node.dataset.threshold));\n    const marker = document.getElementById('drawdownMarker');\n    marker.style.setProperty('--marker-position', `${percent}%`);\n    marker.style.opacity = known ? '1' : '0';\n    document.getElementById('drawdownFill').style.transform = `scaleX(${known ? percent / 100 : 0})`;\n    track.setAttribute('aria-label', known ? `当前回撤 ${m.drawdownText}，当前档位 ${active < 0 ? '观察' : tierName(active)}，策略最大阈值 ${maximum}%` : '当前回撤暂无数据');\n    document.querySelectorAll('.metrics-page').forEach((page, index) => page.querySelectorAll('.metric-value').forEach((node, metric) => { node.textContent = m.performance[index]?.[metric] || '—'; setTone(node,node.textContent); }));\n    updateRefresh(!!m.refreshing, !!m.refreshSucceeded,m.refreshError);\n  }\n  render(parent.V2Store.getState()); parent.V2Store.subscribe(render);\n  refreshButton.addEventListener('click', () => {\n    if (parent.NDXMarketRead) return; // Production waits for the native read result.\n    parent.V2Store.replaceUiState({...parent.V2Store.getState(),nd100:{...parent.V2Store.getState().nd100,refreshing:true,refreshSucceeded:false}});\n    setTimeout(() => parent.V2Store.replaceUiState({...parent.V2Store.getState(),nd100:{...parent.V2Store.getState().nd100,refreshing:false,refreshSucceeded:true}}),900);\n  });\n})();\n<\/script></body>\n</html>\n","持仓":"<!--\n  WORKING COPY\n  Level 1 / Level 2 / 排序沿用用户保存的冻结基线。\n  本文件仅继续开发 Level 3 详情与 Level 2 -> Level 3 Shared Card Transition。\n-->\n\n<!--\n  NDX Invest · 持仓一级 / 二级\n  FROZEN BASELINE — 2026-09-22\n\n  已冻结范围：\n  - 持仓一级视觉与信息层级\n  - 一级 ↔ 二级共享主面板拖拽过渡\n  - 二级 Vertical Pager 的跟手、300ms 吸附\n  - 卡片离场斜后方渐隐 / 进入镜像渐显\n  - 二级底部“添加丨排序”与主面板把手连续关系\n\n  后续除非明确要求，不修改上述已冻结部分。\n-->\n<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\" />\n  <title>NDX Invest · 持仓一级 / 二级 / 三级统一原型</title>\n\n  <style>\n    :root {\n      --bg: #f5f7f8;\n      --surface: #ffffff;\n      --surface-soft: #f0f2f3;\n\n      --text: #17212b;\n      --text-2: #66788a;\n      --text-3: #98a5b2;\n      --disabled: #c3cbd2;\n      --divider: #e7ebee;\n\n      --brand: #62bfa0;\n      --brand-soft: #e7f5ef;\n\n rics-viewport,\n            .period-tabs,.sliding-tabs,.nav,.main-nav,.refresh,.filter,.node,.toast,\n            .index-value,.fund-name,.row-title,.metric-value) {\n            transition:background-color 130ms ease,color 130ms ease,border-color 130ms ease,box-shadow 130ms ease!important\n          }\n        }\n      \n          :root[data-theme=\"dark\"] {\n            --bg:var(--bg-primary);--surface:var(--surface-primary);--surface-soft:var(--surface-secondary);\n            --text:var(--text-primary);--text-2:var(--text-secondary);--text-3:var(--text-tertiary);\n            --disabled:var(--text-disabled);--divider:var(--border-subtle);\n            --brand:var(--accent-primary);--brand-soft:var(--accent-soft);\n            --profit:#45C88A;--loss:#F06A6A;\n            --buy-soft:var(--profit-soft);--buy-text:var(--profit);\n            --sell-soft:var(--loss-soft);--sell-text:var(--loss);\n            --record-soft:rgba(145,176,203,.12);--record-text:#91B0CB;\n            --calendar-blue:var(--accent-primary)\n          }\n          html[data-theme=\"dark\"] .app,html[data-theme=\"dark\"] .level3-page {background:var(--bg)}\n          html[data-theme=\"dark\"] .fund-card {background:var(--surface-primary);border-color:#242A33;box-shadow:0 8px 24px rgba(0,0,0,.24)}\n          html[data-theme=\"dark\"] .fund-card .fund-name {color:var(--text-primary)!important} \n          html[data-theme=\"dark\"] .fund-card::after {border-color:rgba(91,140,255,.04);box-shadow:none}\n          html[data-theme=\"dark\"] .fund-meta-line,html[data-theme=\"dark\"] .small-label,\n          html[data-theme=\"dark\"] .metric-label {color:var(--text-tertiary)}\n          html[data-theme=\"dark\"] .main-sheet {background:rgba(20,23,28,.985);border-top-color:var(--border-subtle);box-shadow:none}\n          html[data-theme=\"dark\"] .sheet-handle {background:var(--border-normal)}\n          html[data-theme=\"dark\"] .card,html[data-theme=\"dark\"] .sort-card {\n            background:va ocument.getElementById('l3HoldingDays').textContent=holdingTime.days;\n        l3NavDate.textContent = data.navDate;\n        l3NavStatus.textContent = data.navStatus;\n      }\n\n      function level3HeroGeom() {\n        return {\n          top: 44,\n          width: app.clientWidth - 32,\n          height: 172,\n          opacity: 1,\n          scale: 1,\n          x: 0,\n          z: 8\n        };\n      }\n\n      function easeOutBack(t, overshoot = .42) {\n        const x = clamp(t);\n        const c1 = overshoot;\n        const c3 = c1 + 1;\n        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);\n      }\n\n      function easeInBack(t, overshoot = .36) {\n        const x = clamp(t);\n        const c1 = overshoot;\n        const c3 = c1 + 1;\n        return c3 * x * x * x - c1 * x * x;\n      }\n\n      function prepareDetailSheetCollapsed() {\n        detailSheet.style.clipPath = \"inset(0 0 100% 0)\";\n        detailSheet.style.transform = \"translateY(-12px) scale(.994)\";\n        detailSheet.style.setProperty(\"--detail-seam-shadow\", \"0\");\n      }\n\n      function renderDetailSheetEnter(progress) {\n        const p = clamp(progress);\n        const eased = easeOutBack(p);\n        const hiddenBottom = (1 - p) * 100;\n\n        detailSheet.style.clipPath =\n          `inset(0 0 ${hiddenBottom}% 0)`;\n\n        detailSheet.style.transform =\n          `translateY(${lerp(-12, 0, eased)}px) scale(${lerp(.994,1,eased)})`;\n\n        detailSheet.style.setProperty(\n          \"--detail-seam-shadow\",\n          String(smoothstep(clamp(p * 1.35)))\n        );\n      }\n\n      function renderDetailSheetExit(progress) {\n        const p = clamp(progress);\n        const eased = easeInBack(p);\n        const hiddenBottom = p * 100;\n\n        detailSheet.style.clipPath =\n          `inset(0 0 ${hiddenBottom}% 0)`;\n\n        detailSheet.style.transform =\n          `translateY(${lerp(0,-12,eased)}px) scale(${lerp(1,.994,eased)})`;\n\n        de erp(from.height, to.height, heroEase);\n\n          level2Meta.style.opacity =\n            String(1 - heroEase);\n\n          level2Actions.style.opacity =\n            String(1 - heroEase);\n\n          mainSheet.style.opacity =\n            String(1 - heroEase);\n\n          // 返回 / 设置图标在 Hero 接近到位时再出现\n          const headerFade =\n            smoothstep(\n              clamp((heroRaw - .35) / .65)\n            );\n\n          level3Header.style.opacity =\n            String(headerFade);\n          level3Header.style.transform =\n            `translateY(${lerp(-4,0,headerFade)}px)`;\n\n          if (activeSummary) {\n            activeSummary.style.opacity=String(1-smoothstep(clamp(raw/.12)));\n            activeSummary.style.transform='';\n          }\n\n          cards.forEach((card, index) => {\n            if (card === activeCard) {\n              if(raw<=.12){applyCardGeom(card,from);return;}\n              applyHeroGeom(card, {\n                top: heroTop,\n                width:\n                  lerp(from.width, to.width, heroEase),\n                height:\n                  heroHeight,\n                opacity: 1,\n                innerOpacity: 1,\n                shellOpacity: 1,\n                scale: 1,\n                x: 0,\n                z: 20\n              }, to);\n              return;\n            }\n\n            const base =\n              level2Geom(card, currentIndex);\n\n            const side =\n              index < currentIndex ? -1 : 1;\n\n            // 只有二级里本来可见的相邻卡参与淡出。\n            // Far 卡（base.opacity === 0）始终保持隐藏，\n            // 避免第一张/第三张作为中央卡时白色卡壳突然出现。\n            const baseVisible =\n              base.opacity > 0.005 ? 1 : 0;\n\n            applyCardGeom(card, {\n              ...base,\n              top:\n                base.top +\n                side * 26 * heroEase,\n              scale:\n                lerp(\n                  base.scale,\n                  base.scale * .975,\n                  heroEase\n                ),\n              x:\n                side * 6 * heroEase,\n              shellOpacity:\n                baseVisible * (1 - heroEase),\n              innerOpacity:\n                baseVisible ? base.opacity : 0,\n              z: 1\n            });\n          });\n\n          if (raw > HERO_PHASE_END) {\n            const sheetRaw =\n              clamp(\n                (raw - HERO_PHASE_END) /\n                (1 - HERO_PHASE_END)\n              );\n\n            renderDetailSheetEnter(\n              easeOutCubic(sheetRaw)\n            );\n          }\n\n          if (raw < 1) {\n            rafId =\n              requestAnimationFrame(frame);\n          } else {\n            mode = \"level3\";\n            applyCardGeom(activeCard,to);\n            level3Scroll.style.touchAction=\"pan-y\";\n\n            app.classList.remove(\n              \"level3-transition\"\n            );\n            app.classList.add(\n              \"level3-mode\"\n            );\n\n            resetDetailSheet();\n            detailSheet.style.setProperty(\n              \"--detail-seam-shadow\",\n              \"1\"\n            );\n            level3Header.style.opacity = \"1\";\n            level3Header.style.transform = \"translateY(0)\";\n\n            if (activeSummary) {\n              activeSummary.style.opacity = \"0\";\n              activeSummary.style.transform =\n                \"translateY(5px)\";\n            }\n          }\n        }\n\n        rafId =\n          requestAnimationFrame(frame);\n      }\n\n      function animateLevel3Exit() {\n        if (mode !== \"level3\") return;\n\n        cancelAnimationFrame(rafId);\n\n        const activeCard = cards[currentIndex];\n        const activeSummary =\n          activeCard.querySelector(\".card-summary\");\n\n        const from =\n          level3HeroGeom();\n        const to =\n          level2Geom(activeCard, currentIndex);\n\n        const start =\n          performance.now();\n\n        /*\n         * Overlapping exit:\n         * - Detail Sheet starts folding first.\n         * - At ~65% fold progress, Hero already begins to return.\n         * - Other fund cards restore slightly after Hero starts.\n         */\n        const duration = 760;\n\n        mode = \"transitioning\";\n\n        app.classList.remove(\"level3-mode\");\n        app.classList.add(\"level3-transition\");\n\n        level3Page.style.pointerEvents = \"none\";\n\n        function frame(now) {\n          const raw =\n            clamp((now - start) / duration);\n\n          const sheetProgress =\n            smoothstep(clamp(raw / .74));\n\n          const heroStart = .48;\n          const heroProgress =\n            smoothstep(\n              clamp((raw - heroStart) / (1 - heroStart))\n            );\n\n          const othersStart = .58;\n          const othersProgress =\n            smoothstep(\n              clamp((raw - othersStart) / (1 - othersStart))\n            );\n\n          renderDetailSheetExit(sheetProgress);\n\n          // Header fades early\n          level3Header.style.opacity =\n            String(\n              1 - smoothstep(\n                clamp(raw / .24)\n              )\n            );\n\n          // Hero starts moving before sheet fully collapses\n          applyHeroGeom(activeCard, {\n            top:\n              lerp(from.top, to.top, heroProgress),\n            width:\n              lerp(from.width, to.width, heroProgress),\n            height:\n              lerp(from.height, to.height, heroProgress),\n            opacity: 1,\n            innerOpacity: 1,\n            shellOpacity: 1,\n            scale: 1,\n            x: 0,\n            z: 20\n          }, from);\n\n          level2Meta.style.opacity =\n            String(othersProgress);\n\n          level2Actions.style.opacity =\n            String(othersProgress);\n\n          mainSheet.style.opacity =\n            String(othersProgress);\n\n          if (activeSummary) { activeSummary.style.opacity='0'; activeSummary.style.transform=''; }\n\n          cards.forEach((card, index) => {\n            if (card === activeCard) return;\n\n            const base =\n              level2Geom(card, currentIndex);\n\n            const side =\n              index < currentIndex ? -1 : 1;\n\n            // 只恢复二级中本来可见的卡片。\n            // Far 卡继续保持隐藏，防止退出三级时突然闪现。\n            const baseVisible =\n              base.opacity > 0.005 ? 1 : 0;\n\n            applyCardGeom(card, {\n              ...base,\n              top:\n                base.top +\n                side * 22 * (1 - othersProgress),\n              scale:\n                lerp(\n                  base.scale * .978,\n                  base.scale,\n                  othersProgress\n                ),\n              x:\n                side * 5 * (1 - othersProgress),\n              shellOpacity:\n                baseVisible * othersProgress,\n              innerOpacity:\n                baseVisible ? base.opacity : 0,\n              z:\n                base.z\n            });\n          });\n\n          if (raw < 1) {\n            rafId =\n              requestAnimationFrame(frame);\n          } else {\n            mode = \"level2\";\n\n            app.classList.remove(\n              \"level3-transition\"\n            );\n\n            level3Page.classList.remove(\n              \"is-visible\"\n            );\n\n            level3Page.setAttribute(\n              \"aria-hidden\",\n              \"true\"\n            );\n\n            level3Page.style.opacity = \"\";\n            level3Page.style.pointerEvents = \"\";\n            mainSheet.style.opacity = \"\";\n            mainSheet.style.pointerEvents = \"\";\n\n            resetDetailSheet();\n            detailSheet.style.setProperty(\n              \"--detail-seam-shadow\",\n              \"0\"\n            );\n\n            level3Header.style.opacity = \"\";\n            level3Header.style.transform = \"\";\n\n            renderTransition(1);\n            renderPagerSettled(currentIndex);\n            if(activeSummary){activeSummary.style.opacity='1';activeSummary.style.transform='';if(!matchMedia('(prefers-reduced-motion: reduce)').matches)activeSummary.animate([{opacity:0},{opacity:1}],{duration:190,easing:'ease-out'});}\n\n            level2Actions.style.pointerEvents =\n              \"auto\";\n\n            stage.style.pointerEvents =\n              \"auto\";\n          }\n        }\n\n        rafId =\n          requestAnimationFrame(frame);\n      }\n\n      /* 一级位置：\n         上一张露在上面，当前卡前景，下一张完全藏在当前卡下方 */\n      function level1Geom(card) {\n        const selected = cards.indexOf(card) === currentIndex;\n        return {\n          top: 106,\n          width: app.clientWidth - (selected ? 34 : 42),\n          height: 104,\n          opacity: selected ? 1 : 0,\n          scale: selected ? 1 : .98,\n          x: 0,\n          z: selected ? 4 : 2\n        };\n      }\n\n      function pagerSlotGeom(delta) {\n        const h = 172;\n        const width = app.clientWidth - 32;\n        const bottomReserved = 96;\n        const center = (app.clientHeight - bottomReserved) / 2;\n\n        /*\n         * 回到原来的纯纵向 Pager。\n         *\n         * 关键修正：\n         * Current        opacity 1.00\n         * Previous/Next  opacity 0.58\n         * Far            opacity 0.00\n         *\n         * Previous/Next → Far 之间使用连续插值，\n         * 所以卡片会从约 58% 一路慢慢淡到 0%，\n         * 不再在某个阈值突然消失。\n         */\n        const anchors = {\n          \"-3\": { y: -310, opacity: 0,    scale: .90,  z: 0 },\n          \"-2\": { y: -232, opacity: 0,    scale: .92,  z: 1 },\n          \"-1\": { y: -124, opacity: .58,  scale: .955, z: 3 },\n           \"0\": { y:    0, opacity: 1,    scale: 1,    z: 5 },\n           \"1\": { y:  124, opacity: .58,  scale: .955, z: 3 },\n           \"2\": { y:  232, opacity: 0,    scale: .92,  z: 1 },\n           \"3\": { y:  310, opacity: 0,    scale: .90,  z: 0 }\n        };\n\n        const bounded = clamp(delta, -3, 3);\n        const low = Math.floor(bounded);\n        const high = Math.ceil(bounded);\n\n        const a = anchors[String(low)];\n        const b = anchors[String(high)];\n        const t = high === low ? 0 : bounded - low;\n\n        return {\n          top: center + lerp(a.y, b.y, t) - h / 2,\n          width,\n          height: h,\n          opacity: lerp(a.opacity, b.opacity, t),\n          scale: lerp(a.scale, b.scale, t),\n          x: 0,\n          z: Math.round(lerp(a.z, b.z, t))\n        };\n      }\n\n      function level2Geom(card, virtualIndex = currentIndex) {\n        const index = cards.indexOf(card);\n        return pagerSlotGeom(index - virtualIndex);\n      }\n\n      function sheetTravelDistance() {\n        // 一级顶部 156px -> 二级底部只露 46px 左右\n        const sheetTop = 144;\n        const targetTop = app.clientHeight - 47 - (window.innerHeight - document.documentElement.clientHeight);\n        return Math.max(360, targetTop - sheetTop);\n      }\n\n      function renderTransition(p) {\n        transitionProgress = clamp(p);\n\n        // Read all geometry before any writes; a frame must not force layout per card.\n        const geometry = cards.map(card => ({ card, a: level1Geom(card), b: level2Geom(card) }));\n        const travel = sheetTravelDistance();\n        geometry.forEach(({ card, a, b }) => {\n\n          const top = lerp(a.top, b.top, transitionProgress);\n          const width = lerp(a.width, b.width, transitionProgress);\n          const height = lerp(a.height, b.height, transitionProgress);\n          const scale = lerp(a.scale, b.scale, transitionProgress);\n          let opacity;\n          const index = cards.indexOf(card);\n\n          if (index !== currentIndex) {\n            // Neighboring cards emerge from behind the selected card in both directions.\n            const delayed = clamp((transitionProgress - .18) / .82);\n            opacity = lerp(a.opacity, b.opacity, delayed);\n          } else {\n            opacity = lerp(a.opacity, b.opacity, transitionProgress);\n          }\n\n          const sx = width / b.width, sy = height / b.height;\n          if(card.style.top !== \"0px\") card.style.top = \"0px\";\n          if(card.style.width !== `${b.width}px`) card.style.width = `${b.width}px`;\n          if(card.style.height !== `${b.height}px`) card.style.height = `${b.height}px`;\n          card.style.setProperty(\"--motion-sx\", String(sx));\n          card.style.setProperty(\"--motion-sy\", String(sy));\n\n          const neighbor = index !== currentIndex;\n          const reveal = neighbor ? clamp((transitionProgress - .18) / .82) : 1;\n          const visible = opacity > 0;\n          card.style.opacity = visible ? String(reveal) : \"0\";\n          card.inert = !visible;\n\n          const inner = card.querySelector(\".fund-card-inner\");\n          if (inner) {\n            // Fade the whole card while keeping the original settled content opacity.\n            inner.style.opacity = neighbor ? String(b.opacity) : String(opacity);\n          }\n\n          card.style.transform =\n            `translate3d(-50%, ${top + (height - b.height) / 2}px, 0) scale(${sx * scale}, ${sy * scale})`;\n          const cardTop = card.querySelector(\".fund-card-top\");\n          cardTop.style.transformOrigin = \"top left\";\n          cardTop.style.transform = `translate3d(${18 / sx - 18}px, ${16 / sy - 16}px,0) scale(${1 / sx},${1 / sy})`;\n          card.style.zIndex = String(transitionProgress < .50 ? a.z : b.z);\n\n          card.querySelector(\".fund-meta-line\").style.opacity = String(clamp((transitionProgress - .35) / .65));\n          const name = card.querySelector(\".fund-name\");\n          const indexIsCurrent = index === currentIndex;\n          name.style.fontSize = `${lerp(indexIsCurrent ? 18 : 14, 18, transitionProgress)}px`;\n          name.style.color = indexIsCurrent || transitionProgress > .82\n            ? \"#17212b\"\n            : `rgba(23,33,43,${lerp(.42,1,transitionProgress)})`;\n\n          const summary = card.querySelector(\".card-summary\");\n          const sp = clamp((transitionProgress - .42) / .58);\n          summary.style.opacity = String(sp);\n          summary.style.transformOrigin = \"bottom right\";\n          summary.style.transform = `translate3d(${18 - 18 / sx}px,${16 - 16 / sy + lerp(5,0,sp) / sy}px,0) scale(${1 / sx},${1 / sy})`;\n        });\n\n        // 核心：同一块白色主面板只做位移，不做淡出\n        const sheetY = travel * transitionProgress;\n        mainSheet.style.transform = `translateY(${sheetY}px)`;\n\n        // 内容随面板一起往下移；只有快离开屏幕时略淡，\n        // 白色面板本身始终完整存在\n        const contentFade = clamp((transitionProgress - .60) / .40);\n        overviewContent.style.opacity = String(1 - contentFade);\n\n        // 主底栏可以淡出，因为它不是白色主面板的一部分\n        mainNav.style.opacity = String(1 - transitionProgress);\n        mainNav.style.transform = `translate(-50%, ${lerp(0,90,transitionProgress)}px)`;\n\n        const secondary = clamp((transitionProgress - .56) / .44);\n        level2Meta.style.opacity = String(secondary);\n        level2Actions.style.opacity = String(secondary);\n\n        level2Actions.style.pointerEvents =\n          secondary > .98 ? \"auto\" : \"none\";\n\n        pagerCounter.textContent = `${currentIndex + 1} / ${cards.length}`;\n\n        stage.style.pointerEvents =\n          mode === \"level2\" && transitionProgress > .99 ? \"auto\" : \"none\";\n      }\n\n      // Freeze the hero's layout for each transition; animate its compositor transform.\n      function applyHeroGeom(card,geom,layout) {\n        card.style.top='0px';card.style.width=layout.width+'px';card.style.height=layout.height+'px';\n        const sx=geom.width/layout.width,sy=geom.height/layout.height;\n        card.style.transform='translate3d(-50%,'+geom.top+'px,0) scale('+sx+','+sy+')';\n        card.style.opacity='1';card.style.zIndex='20';\n        card.querySelector('.fund-card-top').style.transform='scale('+1/sx+','+1/sy+')';\n        card.querySelector('.fund-card-top').style.transformOrigin='top left';\n      }\n      function applyCardGeom(card, geom) {\n        card.querySelector(\".fund-card-top\").style.transform = \"\";\n        const summary = card.querySelector(\".card-summary\");\n        if (summary && mode === \"level2\") summary.style.transform = \"translateY(0px)\";\n        const pager = mode === \"level2\";\n        const top = pager ? \"0px\" : `${geom.top}px`;\n        const width = `${geom.width}px`, height = `${geom.height}px`;\n        if(card.style.top !== top) card.style.top = top;\n        if(card.style.width !== width) card.style.width = width;\n        if(card.style.height !== height) card.style.height = height;\n\n        /*\n         * 默认状态：\n         * 白色卡片实体保持不透明，只淡化内部内容，避免后方文字透出。\n         *\n         * 离场状态：\n         * 可传 shellOpacity，让整张卡随拖动真正淡到 0。\n         * 这样不会再出现“白色实体一直存在，最后突然消失”的断点。\n         */\n        const shellOpacity =\n          geom.shellOpacity !== undefined\n            ? clamp(geom.shellOpacity)\n            : (geom.opacity > 0.005 ? 1 : 0);\n\n        const innerOpacity =\n          geom.innerOpacity !== undefined\n            ? clamp(geom.innerOpacity)\n            : (geom.opacity > 0.005 ? geom.opacity : 0);\n\n        card.style.opacity = String(shellOpacity);\n        card.inert = shellOpacity <= .005;\n\n        const inner = card.querySelector(\".fund-card-inner\");\n        if (inner) {\n          inner.style.opacity = String(innerOpacity);\n        }\n\n        const x = geom.x || 0;\n        card.style.transform =\n          pager ? `translate3d(calc(-50% + ${x}px), ${geom.top}px, 0) scale(${geom.scale})` :\n          `translateX(calc(-50% + ${x}px)) scale(${geom.scale})`;\n        card.style.zIndex = String(geom.z);\n      }\n\n      function renderPagerSettled(centerIndex = currentIndex) {\n        cards.forEach(card => {\n          applyCardGeom(card, level2Geom(card, centerIndex));\n        });\n\n        pagerCounter.textContent = `${currentIndex + 1} / ${cards.length}`;\n        fitHandleHitArea();\n      }\n\n      /*\n       * 二级滑动采用两阶段运动：\n       *\n       * 1. Reveal\n       *    当前卡沿手指方向移开得更快；\n       *    将出现卡只轻微跟随。\n       *    两张 172px 高的卡最终拉开到约 190px 中心距，\n       *    也就是完整露出后仍保留约 18px 空隙。\n       *\n       * 2. Catch-up\n       *    将出现卡快速追向中央；\n       *    原中央卡只补完剩余短距离。\n       *\n       * direction:\n       *   +1 = 向上滑，下一张从下方成为中央卡\n       *   -1 = 向下滑，上一张从上方成为中央卡\n       */\n      function renderPagerDrag(direction, travel) {\n        const targetIndex = currentIndex + direction;\n\n        if (targetIndex < 0 || targetIndex >= cards.length) {\n          return;\n        }\n\n        const reveal = clamp(travel / PAGER_REVEAL_DISTANCE);\n        const catchRaw = clamp(\n          (travel - PAGER_REVEAL_DISTANCE) /\n          (PAGER_TOTAL_DISTANCE - PAGER_REVEAL_DISTANCE)\n        );\n        const catchUp = smoothstep(catchRaw);\n        const overall = smoothstep(clamp(travel / PAGER_TOTAL_DISTANCE));\n\n        const currentCard = cards[currentIndex];\n        const incomingCard = cards[targetIndex];\n\n        // 与滑动方向相反一侧的相邻卡，就是本次离场卡。\n        // 向上切下一张时，上方卡离场；\n        // 向下切上一张时，下方卡离场。\n        const outgoingIndex = currentIndex - direction;\n        const outgoingCard =\n          outgoingIndex >= 0 && outgoingIndex < cards.length\n            ? cards[outgoingIndex]\n            : null;\n\n        /*\n         * 本次切换后，新进入视野的边缘卡。\n         * 它需要做离场卡的反向镜像渐显。\n         */\n        const enteringEdgeIndex = targetIndex + direction;\n        const enteringEdgeCard =\n          enteringEdgeIndex >= 0 && enteringEdgeIndex < cards.length\n            ? cards[enteringEdgeIndex]\n            : null;\n\n        cards.forEach(card => {\n          const from = level2Geom(card, currentIndex);\n          const to = level2Geom(card, targetIndex);\n\n          if (card === outgoingCard) {\n            /*\n             * 离场卡：\n             * 淡化进度完全由手指拖动距离驱动。\n             * travel = 0      -> sh           card.style.transition = \"none\";\n          card.style.transform = `translateY(${dy}px)`;\n\n          // 强制提交第一帧，再回到 0，形成“被挤走”的惯性感\n          card.getBoundingClientRect();\n\n          card.classList.add(\"is-shifting\");\n          card.style.transition =\n            \"transform 240ms cubic-bezier(.18,.82,.22,1)\";\n          card.style.transform = \"translateY(0)\";\n\n          const cleanup = () => {\n            card.classList.remove(\"is-shifting\");\n            card.style.transition = \"\";\n            card.style.transform = \"\";\n            card.removeEventListener(\"transitionend\", cleanup);\n          };\n\n          card.addEventListener(\"transitionend\", cleanup);\n        });\n      }\n\n      function beginSortDrag(event, handle) {\n        if (!app.classList.contains(\"sort-mode\")) return;\n\n        const card = handle.closest(\".sort-card\");\n        if (!card) return;\n\n        const cardRect = card.getBoundingClientRect();\n\n        sortDrag = {\n          card,\n          handle,\n          pointerId: event.pointerId,\n          startY: event.clientY,\n          lastY: event.clientY,\n          startVisualTop: cardRect.top,\n          cardHeight: cardRect.height,\n          currentIndex: sortCards().indexOf(card),\n          layoutCompensation: 0,\n          moved: false\n        };\n\n        card.classList.add(\"is-dragging\");\n        card.style.opacity = \"0.985\";\n\n        handle.setPointerCapture(event.pointerId);\n      }\n\n      function setDraggedCardTransform(deltaY) {\n        if (!sortDrag) return;\n\n        /*\n         * layoutCompensation 用来抵消 DOM 换位造成的基准位置变化。\n         * 所以跨过中线后，卡片不会突然跳到新布局位置，\n         * 而是继续贴着手指。\n         */\n        const visualY =\n          deltaY + sortDrag.layoutCompensation;\n\n        sortDrag.card.style.transform =\n          `translateY(${visualY}px) scale(1.008)`;\n      }\n\n      function reorderWithFlip(targetIndex, deltaY) {\n        if (!sortDrag) return;\n\n        const draggedCard = sortDrag.card;\n        const orderedBefore = sortCards();\n        const currentPos = orderedBefore.indexOf(draggedCard);\n\n        if (targetIndex === currentPos) return;\n\n        const beforeRects = captureSortRects(draggedCard);\n        const beforeDraggedRect =\n          draggedCard.getBoundingClientRect();\n\n        if (targetIndex > currentPos) {\n          const reference = orderedBefore[targetIndex];\n          sortOverlay.insertBefore(\n            draggedCard,\n            reference.nextSibling\n          );\n        } else {\n          const reference = orderedBefore[targetIndex];\n          sortOverlay.insertBefore(\n            draggedCard,\n            reference\n          );\n        }\n\n        /*\n         * DOM 已换位，但视觉位置必须不变。\n         * 计算新布局下的位置变化，并加入 compensation。\n         */\n        const afterDraggedRect =\n          draggedCard.getBoundingClientRect();\n\n        sortDrag.layoutCompensation +=\n          beforeDraggedRect.top - afterDraggedRect.top;\n\n        sortDrag.currentIndex =\n          sortCards().indexOf(draggedCard);\n\n        setDraggedCardTransform(deltaY);\n        animateShiftedCards(beforeRects, draggedCard);\n      }\n\n      function updateSortDrag(event) {\n        if (!sortDrag) return;\n\n        const deltaY =\n          event.clientY - sortDrag.startY;\n\n        if (Math.abs(deltaY) > 4) {\n          sortDrag.moved = true;\n        }\n\n        sortDrag.lastY = event.clientY;\n        setDraggedCardTransform(deltaY);\n\n        const draggedRect =\n          sortDrag.card.getBoundingClientRect();\n\n        const draggedCenter =\n          draggedRect.top + draggedRect.height / 2;\n\n        const ordered = sortCards();\n        const currentPos = ordered.indexOf(sortDrag.card);\n\n        let targetIndex = currentPos;\n\n        // 只判断当前相邻卡，避免一次跨多格造成大跳\n        const previous = ordered[currentPos - 1];\n        const next = ordered[currentPos + 1];\n\n        if (previous) {\n          const r = previous.getBoundingClientRect();\n          const threshold = r.top + r.height * .52;\n\n          if (draggedCenter < threshold) {\n            targetIndex = currentPos - 1;\n          }\n        }\n\n        if (next && targetIndex === currentPos) {\n          const r = next.getBoundingClientRect();\n          const threshold = r.top + r.height * .48;\n\n          if (draggedCenter > threshold) {\n            targetIndex = currentPos + 1;\n          }\n        }\n\n        if (targetIndex !== currentPos) {\n          reorderWithFlip(targetIndex, deltaY);\n        }\n\n        startSortAutoScroll(event.clientY);\n      }\n\n      function endSortDrag() {\n        if (!sortDrag) return;\n\n        stopSortAutoScroll();\n\n        const { card, handle, pointerId } = sortDrag;\n\n        try {\n          handle.releasePointerCapture(pointerId);\n        } catch (_) {}\n\n        /*\n         * 松手时从当前跟手位置吸附到 DOM 新位置。\n         * 180ms，短而不突兀。\n         */\n        card.style.transition =\n          \"transform 180ms cubic-bezier(.2,.8,.2,1), \" +\n          \"box-shadow 180ms ease, opacity 180ms ease\";\n        card.style.transform = \"translateY(0) scale(1)\";\n        card.style.opacity = \"1\";\n        card.classList.remove(\"is-dragging\");\n\n        const cleanup = () => {\n          card.style.transition = \"\";\n          card.style.transform = \"\";\n          card.removeEventListener(\"transitionend\", cleanup);\n        };\n\n        card.addEventListener(\"transitionend\", cleanup);\n\n        sortDrag = null;\n      }\n\n      sortOverlay.addEventListener(\"pointerdown\", event => {\n        const handle =\n          event.target.closest(\".sort-handle\");\n\n        if (!handle) return;\n\n        event.preventDefault();\n        beginSortDrag(event, handle);\n      });\n\n      sortOverlay.addEventListener(\"pointermove\", event => {\n        if (!sortDrag) return;\n\n        event.preventDefault();\n        updateSortDrag(event);\n      });\n\n .palette-swatch[data-swatch="pink"] {background:#FBD2D2;}
html[data-theme="dark"] .palette-swatch[data-swatch="pink"] {background:#E9B3BE;}
`;
  function documents(){return [document,...[...document.querySelectorAll('iframe')].map(f=>f.contentDocument)].filter(d=>d?.documentElement);}
  let nativeSignature='';
  function nativeAppearance(){
    const dark=document.documentElement.dataset.theme==='dark',palette=window.V2Store.getState().palette||saved,signature=palette+':'+dark;
    if(signature!==nativeSignature&&window.NDXUiLocal?.setAppearance){window.NDXUiLocal.setAppearance(dark,palette);nativeSignature=signature;}
  }
  function apply(){
    const palette=window.V2Store.getState().palette||saved;
    for(const doc of documents()){
      if(!doc.getElementById('ndx-palette-style')){const style=doc.createElement('style');style.id='ndx-palette-style';style.textContent=css;doc.head.append(style);}
      if(doc.documentElement.dataset.palette!==palette)doc.documentElement.dataset.palette=palette;
    }
    const mine=document.getElementById('frameMine')?.contentDocument;
    const row=mine?.getElementById('paletteSettingsRow');if(row)row.querySelector('.row-end > span').textContent=labels[palette];
    document.querySelectorAll('[data-palette-choice]').forEach(b=>{const active=b.dataset.paletteChoice===palette;b.setAttribute('aria-pressed',String(active));b.querySelector('.is-check').hidden=!active;});
    nativeAppearance();
  }
  window.V2Store=Object.freeze({...base,setPalette(palette){
    if(!Object.hasOwn(labels,palette))return false;
    try{localStorage.setItem(storageKey,palette);}catch(_){return false;}
    if(base.getState().palette!==palette)base.replaceUiState({...base.getState(),palette});
    return true;
  }});
  base.subscribe(apply);
  // Existing page subscriptions require loaded frame DOM before the first publish.
  Promise.all([...document.querySelectorAll('iframe')].map(frame=>frame.contentDocument?.body?.childElementCount?Promise.resolve():new Promise(resolve=>frame.addEventListener('load',resolve,{once:true})))).then(()=>{
    if(!base.getState().palette)base.replaceUiState({...base.getState(),palette:saved});
  });
  const original=window.V2App;
  window.V2App=Object.freeze({...original,openProfileEntry(title,trigger){
    if(title!=='主题配色')return original.openProfileEntry(title,trigger);
    original.openProfileEntry('深色模式',trigger);
    document.getElementById('settingsTitle').textContent='主题配色';
    document.getElementById('settingsPage').dataset.section='palette';
    document.getElementById('settingsScroll').innerHTML='<section class="settings-section"><div class="settings-label">配色</div><div class="settings-card">'+Object.entries(labels).map(([key,label])=>'<button type="button" class="settings-choice" data-palette-choice="'+key+'" aria-pressed="false"><span><span class="palette-swatch" data-swatch="'+key+'" aria-hidden="true"></span>'+label+'</span><span class="is-check" aria-hidden="true" hidden>✓</span></button>').join('')+'</div></section>';
    document.querySelectorAll('[data-palette-choice]').forEach(b=>b.addEventListener('click',()=>{
      document.getElementById('settingsScroll').querySelector('[role="status"]')?.remove();
      if(!window.V2Store.setPalette(b.dataset.paletteChoice)){const p=document.createElement('p');p.className='settings-footnote';p.setAttribute('role','status');p.textContent='配色未能保存，请重试。';document.getElementById('settingsScroll').append(p);}
    }));apply();
  }});
  function attach(frame){
    const doc=frame.contentDocument;if(!doc?.documentElement)return;
    const themeRow=[...doc.querySelectorAll('.setting-row')].find(r=>r.querySelector('.row-title')?.textContent==='深色模式');
    if(themeRow&&!doc.getElementById('paletteSettingsRow')){
      const row=themeRow.cloneNode(true);row.id='paletteSettingsRow';row.removeAttribute('data-toast');row.querySelector('.row-title').textContent='主题配色';
      row.querySelector('.row-icon').innerHTML='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/><circle cx="15" cy="9" r="1.4" fill="currentColor"/><circle cx="9" cy="15" r="1.4" fill="currentColor"/></svg>';
      row.addEventListener('click',e=>{e.stopPropagation();window.V2App.openProfileEntry('主题配色',row);});themeRow.after(row);
    }
    apply();
  }
  document.querySelectorAll('iframe').forEach(frame=>{frame.addEventListener('load',()=>attach(frame));attach(frame);});
  new MutationObserver(nativeAppearance).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  apply();
})();

</script></body>
</html>
